baseURL: https://arush-sal.github.io/gt7-telemetry-collector/
title: gt7-telemetry-collector
locale: en-US
enableRobotsTXT: true

module:
  hugoVersion:
    extended: true
    min: "0.169.0"
  imports:
    - path: github.com/imfing/hextra

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false

menu:
  main:
    - name: Documentation
      pageRef: /docs
      weight: 1
    - name: Releases
      url: https://github.com/arush-sal/gt7-telemetry-collector/releases
      weight: 2
    - name: Search
      weight: 3
      params:
        type: search
    - name: GitHub
      url: https://github.com/arush-sal/gt7-telemetry-collector
      weight: 4
      params:
        icon: github

params:
  description: Standalone Go collector and library that turns Gran Turismo 7 UDP telemetry into canonical protobuf frames.
  navbar:
    displayLogo: true
    logo:
      path: images/logo.webp
      width: 36
      height: 36
  footer:
    displayCopyright: true
    displayPoweredBy: true
  search:
    enable: true
    type: flexsearch
  theme:
    default: system
    displayToggle: true
  editURL:
    enable: true
    base: https://github.com/arush-sal/gt7-telemetry-collector/edit/master/docs/content
