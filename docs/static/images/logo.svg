<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="gt7-telemetry-collector">
  <defs>
    <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff5a36"/>
      <stop offset="1" stop-color="#d6202b"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#lg)"/>
  <!-- tachometer arc -->
  <path d="M14 42a18 18 0 1 1 36 0" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".35"/>
  <path d="M14 42a18 18 0 0 1 27.5-15.3" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
  <!-- needle -->
  <path d="M32 42 44.5 27" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
  <circle cx="32" cy="42" r="4.5" fill="#fff"/>
  <!-- telemetry trace -->
  <path d="M12 52h10l3-4 4 7 4-9 3 6h16" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" opacity=".9"/>
